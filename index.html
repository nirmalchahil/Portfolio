ADM.bind_sections = function(){
  const rows = document.getElementById("sec-rows");
  if(!rows) return;
  let dragEl = null;
  rows.querySelectorAll("[data-secrow]").forEach(row => {
    row.addEventListener("dragstart", e => { dragEl = row; row.classList.add("dragging"); e.dataTransfer.effectAllowed = "move"; });
    row.addEventListener("dragend", () => { row.classList.remove("dragging"); });
    row.addEventListener("dragover", e => {
      e.preventDefault();
      if(!dragEl || dragEl === row) return;
      const r = row.getBoundingClientRect();
      const after = (e.clientY - r.top) > r.height / 2;
      row.parentNode.insertBefore(dragEl, after ? row.nextSibling : row);
    });
    row.addEventListener("drop", e => e.preventDefault());
  });
  const persistOrder = () => {
    const order = [...rows.querySelectorAll("[data-secrow]")].map(r => r.dataset.secrow);
    State.sections.sort((a,b) => order.indexOf(a.id) - order.indexOf(b.id));
    Data.saveSections(State.sections);
  };
  rows.addEventListener("dragend", persistOrder);
  rows.addEventListener("input", e => {
    const t = e.target;
    if(t.dataset.secTitle){
      const s = sectionById(t.dataset.secTitle); s.title = t.value.trim() || s.name;
      Data.saveSections(State.sections);
    }
    if(t.dataset.secDesc){
      const s = sectionById(t.dataset.secDesc); s.description = t.value;
      Data.saveSections(State.sections);
    }
  });
  rows.addEventListener("change", e => {
    const t = e.target;
    if(t.dataset.secLayout){ const s = sectionById(t.dataset.secLayout); s.layout = t.value; Data.saveSections(State.sections); toast("Layout updated.", "ok"); }
    if(t.dataset.secVis){ const s = sectionById(t.dataset.secVis); s.visible = t.value; Data.saveSections(State.sections); toast(s.visible==="hidden" ? "Section hidden from public site." : "Section visible.", "ok"); }
    if(t.dataset.secOn){ const s = sectionById(t.dataset.secOn); s.enabled = t.checked; Data.saveSections(State.sections); toast(t.checked ? "Section enabled." : "Section disabled.", "ok"); }
  });
};

    const html = FV(f,"html"), css = FV(f,"css"), js = FV(f,"js");

      "</head><body>" + html + "</body></html>";
  }, 500);
  ["html","css","js"].forEach(n => { const el = FE(f, n); if(el) el.addEventListener("input", upd); });

    }catch(err){ toast(err.message, "err"); }
  });
  const fb = view.querySelector("[data-act='fb-connect']");
  if(fb) fb.addEventListener("click", async () => {
    const raw = document.getElementById("fb-config").value.trim();

    State.settings.firebaseConfig = cfg;
    State.settings.storageMode = "firebase";
    await Data.saveSettings(State.settings);
    await Store.init();

  if(fd) fd.addEventListener("click", async () => {
    const ok = await confirmDlg({ title:"Disconnect cloud?", message:"You will switch back to Local Mode (browser storage). Your Firebase data stays in Firebase.", confirmText:"Disconnect", danger:true });

    State.settings.storageMode = "local";

ADM.bind_backup = function(){
  const file = document.getElementById("bk-file");
  if(!file) return;
  let staged = null;
  file.addEventListener("change", () => {
    const f = file.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try{
        const json = JSON.parse(String(r.result));
        staged = json;
        const n = (json.media && json.media.items) ? json.media.items.length : 0;
        document.getElementById("bk-preview").style.display = "flex";
        document.getElementById("bk-preview-title").textContent = "Backup found — " + (json.exportedAt ? U.fmtDate(json.exportedAt) : "no date");
        document.getElementById("bk-preview-msg").innerHTML = "Contains: " +
          (json.profile?"profile, ":"") + (json.posts?json.posts.length+" posts, ":"") +
          (json.projects?json.projects.length+" projects, ":"") + (json.services?json.services.length+" services, ":"") +
          (json.skills?json.skills.length+" skills, ":"") + n + " media files. " +
          "Restoring will affect this browser's data.";
        document.getElementById("bk-actions").style.display = "flex";
      }catch(e){ toast("Could not read that file — is it a valid JSON backup?", "err"); }
    };
    r.readAsText(f);
  });
};

/* ================================================================
   16. ROUTER
   ================================================================ */
const Router = {
  route(){
    const hash = location.hash || "#/";
    if(hash.startsWith("#/admin")){
      const seg = hash.replace(/^#\/admin\/?/, "").split("/").filter(Boolean)[0] || "overview";
      ADM.pageKey = ADM.PAGES[seg] ? seg : "overview";
      ADM.render();
    } else {
      this.showPublic(hash);
    }
  },
  showPublic(hash){
    document.getElementById("admin-root").hidden = true;
    document.getElementById("public-root").hidden = false;
    if(!PUB.ready) PUB.render();
    const mPost = hash.match(/^#\/?post\/([\w-]+)/);
    const mProj = hash.match(/^#\/?project\/([\w-]+)/);
    if(mPost){
      setTimeout(() => PUB.openPost(mPost[1]), 60);
    } else if(mProj){
      setTimeout(() => PUB.openProject(mProj[1]), 60);
    } else if(hash.startsWith("#sec-")){
      setTimeout(() => {
        const el = document.getElementById(hash.slice(1));
        if(el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 40);
    }
  },
  go(hash){
    if(location.hash === hash) Router.route();
    else location.hash = hash;
  }
};
function onHash(){
  const dirty = Modal._dirty && Modal._dirty();
  if(dirty){
    let handled = false;
    confirmDlg({ title:"Unsaved changes", message:"You have unsaved changes in an open editor. Close it and discard?", danger:true, confirmText:"Discard" })
      .then(ok => { if(ok){ Modal._dirty = null; Modal.close(); Router.route(); } else { history.back(); } });
    return;
  }
  Router.route();
}
function onUnload(e){
  if(Modal._dirty && Modal._dirty()){ e.preventDefault(); e.returnValue = ""; }
}

    confirmDlg({ title:"Delete message?", message:"This inbox message will be deleted.", danger:true, confirmText:"Delete" }).then(async ok => {
      if(!ok) return;
      State.inbox = State.inbox.filter(x => x.id !== t.dataset.id);
      await Data.saveInbox(State.inbox);
      toast("Message deleted.", "ok");
      ADM.show("contact");
    });
  },
  /* --- settings / backup --- */
  "wipe-all": (e, t) => {
    confirmDlg({ title:"Erase ALL data?", message:"Profile, posts, projects, media, comments, settings — everything on this device will be erased. Download a backup first!", danger:true, confirmText:"Yes, erase everything" }).then(async ok => {
      if(!ok) return;
      await Data.wipeAll();
      toast("All data erased. Set up your profile again.", "info");
      ProfileEdit.cur = null; ProfileEdit.builtFrom = null;
      Wiz.data = null;
      ADM.pageKey = "profile";
      ADM.render();
    });
  },
  "bk-export": (e, t) => ADM.bkExport(),
  "bk-download": (e, t) => ADM.bkExport(),
  "bk-restore-replace": (e, t) => ADM.bkRestore(true),
  "bk-restore-merge": (e, t) => ADM.bkRestore(false)
};
ADM.pickImage = function(cb){
  /* Attach the input to the DOM before clicking — on several mobile browsers the picker
     never opens for a detached input, which made "upload photo" look dead. */
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  inp.style.cssText = "position:fixed;left:-9999px;top:-9999px;width:2px;height:2px;opacity:0;border:0;padding:0;margin:0;";
  document.body.appendChild(inp);
  let closed = false;
  const cleanup = () => { if(closed) return; closed = true; setTimeout(() => { try{ inp.remove(); }catch(e){} }, 500); };
  inp.addEventListener("change", () => { const f = inp.files && inp.files[0]; cleanup(); if(f) cb(f); });
  try{ inp.addEventListener("cancel", cleanup); }catch(e){}
  try{ inp.click(); }catch(e){ cleanup(); toast("Couldn't open the file picker on this device. Try uploading from the Media page instead.", "err"); }
};
ADM.openSide = function(){
  const s = document.getElementById("adm-side"), sc = document.querySelector(".side-scrim");
  if(s) s.classList.add("open");
  if(sc){ sc.hidden = false; }
};
ADM.closeSide = function(){
  const s = document.getElementById("adm-side"), sc = document.querySelector(".side-scrim");
  if(s) s.classList.remove("open");
  if(sc) sc.hidden = true;
};
ADM.bkExport = async function(){
  const incl = document.getElementById("bk-include-media");
  toast("Preparing backup…", "info");
  const payload = await Backup.exportAll(incl ? incl.checked : true);
  Backup.download(payload);
  toast("Backup downloaded.", "ok");
};
ADM.bkRestore = async function(replace){
  const file = document.getElementById("bk-file");
  if(!file || !file.files[0]){ toast("Choose a backup file first.", "err"); return; }
  const msg = replace
    ? "This will REPLACE everything in this browser with the backup contents. Continue?"
    : "This will merge the backup with your current data (new items added, media deduplicated). Continue?";
  const ok = await confirmDlg({ title:"Restore backup?", message: msg, danger: replace, confirmText: replace ? "Restore (replace)" : "Merge" });
  if(!ok) return;
  try{
    const r = new FileReader();
    r.onload = async () => {
      try{
        const json = JSON.parse(String(r.result));
        const counts = await Backup.importAll(json, { replace });
        toast("Backup restored — " + (counts.posts||0) + " posts, " + (counts.projects||0) + " projects, " + (counts.media||0) + " media files.", "ok");
        ADM.show("backup");
        if(PUB.ready) PUB.refresh();
      }catch(err){ toast("Restore failed: " + err.message, "err"); }
    };
    r.readAsText(file.files[0]);
  }catch(err){ toast("Could not read the file.", "err"); }
};

      "</div>"+
      '<div class="row-grid">'+

        '<div class="field"><label>To</label><input class="input" name="to" maxlength="20" value="'+U.esc(x.to)+'" placeholder="e.g. Present"></div>'+

ACTS["xp-save"] = async (e, t) => {
  const f = document.getElementById("xp-form");
  if(!f || !FV(f,"role").trim()){ toast("Role is required.", "err"); return; }
  const x = { role: FV(f,"role").trim(), org: FV(f,"org").trim(), from: FV(f,"from").trim(), to: FV(f,"to").trim(), desc: FV(f,"desc").trim() };
  const target = ProfileEdit.cur || State.profile;
  if(!target.experience) target.experience = [];
  const idx = parseInt(t.dataset.idx, 10);
  if(idx === -1) target.experience.push(x);
  else target.experience[idx] = x;
  await Data.saveProfile(target);
  Modal.close();
  toast("Experience saved.", "ok");
  ADM.show("profile");
};
function moveSection(id, dir){
  const i = State.sections.findIndex(s => s.id === id);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= State.sections.length) return;
  const tmp = State.sections[i];
  State.sections[i] = State.sections[j];
  State.sections[j] = tmp;
  Data.saveSections(State.sections);
  ADM.show("sections");
}
function moveSocial(key, dir){
  const c = SocialEdit.cur;
  if(!c) return;
  const i = c.order.indexOf(key);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= c.order.length) return;
  const tmp = c.order[i]; c.order[i] = c.order[j]; c.order[j] = tmp;
  ADM.rerenderSocial();
}
function moveCar(t, dir){
  const car = document.querySelector('.car[data-car="'+t.dataset.car+'"]') || t.closest(".car");
  if(!car) return;
  const imgs = [...car.querySelectorAll("img")];
  let idx = (parseInt(car.dataset.idx, 10) || 0) + dir;
  if(idx < 0) idx = imgs.length - 1;
  if(idx >= imgs.length) idx = 0;
  car.dataset.idx = String(idx);
  imgs.forEach((im, i) => im.style.display = i === idx ? "" : "none");
  const dots = car.querySelectorAll(".m-dots i");
  dots.forEach((d, i) => d.classList.toggle("on", i === idx));
  const cnt = car.querySelector(".m-count");
  if(cnt) cnt.textContent = (idx + 1) + "/" + imgs.length;
}
function runSearch(type, q){
  q = (q || "").toLowerCase();
  if(type === "public") PUB.renderPublicSearchResults(q);
  else if(type === "projects"){
    document.querySelectorAll("#prj-grid .prj-card").forEach(c => {
      const ok = !q || (c.dataset.title || "").includes(q) || (c.dataset.tech || "").includes(q);
      c.style.display = ok ? "" : "none";
    });
  } else if(type === "posts"){
    document.querySelectorAll("#posts-list .lrow").forEach(r => {
      const p = postById(r.dataset.postrow);
      if(!p) return;
      const hay = ((p.title||"") + " " + (p.caption||"") + " " + (p.tags||[]).join(" ")).toLowerCase();
      r.style.display = !q || hay.includes(q) ? "" : "none";
    });
  } else if(type === "projects-adm"){
    document.querySelectorAll("#prj-adm-list .lrow").forEach(r => {
      const p = projectById(r.dataset.prjrow);
      if(!p) return;
      const hay = ((p.title||"") + " " + (p.description||"") + " " + (p.technologies||[]).join(" ") + " " + (p.category||"")).toLowerCase();
      r.style.display = !q || hay.includes(q) ? "" : "none";
    });
  } else if(type === "media"){
    const grid = document.getElementById("media-grid");
    if(grid){ grid.innerHTML = ADM.mediaGridHtml(q); PUB.hydrate(grid); }
  } else if(type === "comments"){
    const f = document.querySelector("#cmt-filters .chip.active");
    ADM.filterComments(f ? f.dataset.cfilter : "all", q);
  }
}
function applyStatusFilters(){
  const ps = document.querySelector('[data-filter="post-status"]');
  if(ps) document.querySelectorAll("#posts-list .lrow").forEach(r => {
    const p = postById(r.dataset.postrow);
    if(!p) return;
    r.style.display = !ps.value || (ps.value === "pub" ? p.published : !p.published) ? "" : "none";
  });
  const ps2 = document.querySelector('[data-filter="prj-adm-status"]');
  if(ps2) document.querySelectorAll("#prj-adm-list .lrow").forEach(r => {
    const p = projectById(r.dataset.prjrow);
    if(!p) return;
    r.style.display = !ps2.value || (ps2.value === "pub" ? p.published : !p.published) ? "" : "none";
  });
  const cat = document.querySelector('[data-filter="prj-cat"]');
  const feat = document.querySelector('[data-filter="prj-feat"]');
  if(cat || feat){
    document.querySelectorAll("#prj-grid .prj-card").forEach(c => {
      const okCat = !cat.value || c.dataset.cat === cat.value.toLowerCase();
      const okFeat = !(feat.dataset.on === "1") || c.dataset.feat === "1";
      c.style.display = okCat && okFeat ? "" : "none";
    });
  }
}
async function handleContentForm(f){
  const key = f.dataset.cform;
  if(key === "contact"){
    const name = FV(f,"name").trim(), email = FV(f,"email").trim(), msg = FV(f,"message").trim();
    if(!name){ toast("Please enter your name.", "err"); return; }
    if(!U.validEmail(email)){ toast("Please enter a valid email.", "err"); return; }
    if(msg.length < 5){ toast("Message is a bit short — tell me a little more.", "err"); return; }
    State.inbox.unshift({ id: U.uid(), name: name.slice(0,60), email: email.slice(0,80), message: msg.slice(0,2000), date: new Date().toISOString(), read: false });
    await Data.saveInbox(State.inbox);
    const owner = State.profile && State.profile.email;
    f.innerHTML = '<div class="empty" style="padding:34px 10px"><span class="e-ic">'+I("check")+'</span><b>Message sent!</b>'+
      "<span>Thank you, " + U.esc(name) + ". Your message is saved to the owner's inbox (Local Mode).</span>"+
      (owner ? '<a class="btn btn-outline btn-sm" style="margin-top:10px" href="mailto:'+U.esc(owner)+'?subject='+encodeURIComponent("Message from " + name) + '&body=' + encodeURIComponent(msg) + '">' + I("mail","ic-sm") + "Or email directly</a>" : "") +
      "</div>";
    toast("Message saved to inbox — the owner will see it on this device.", "ok");
    return;
  }
  const [kind, id] = key.split("|");
  const author = f.querySelector("[name=cname]").value.trim();
  const text = f.querySelector("[name=ctext]").value;
  const btn = f.querySelector('button[type="submit"]');
  btn.disabled = true;
  try{
    const c = await Comments.add(kind, id, author, text);
    f.querySelector("[name=ctext]").value = "";
    if(c.status === "approved"){
      const box = document.getElementById("cmts-" + kind + "-" + id);
      if(box){
        box.innerHTML = PUB.commentsHtml(kind, id);
        box.classList.add("open");
      }
      const cnt = document.querySelector('#cmts-' + kind + '-' + id);
    }
  }catch(err){ toast(err.message, "err"); }
  finally{ btn.disabled = false; }
}
function setupDelegation(){
  let searchTimer = null;
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-act]");
    if(!t) return;
    const stopHost = e.target.closest("[data-stop]");
    if(stopHost && stopHost !== t) return;
    const fn = ACTS[t.dataset.act];
    if(fn){ e.preventDefault(); fn(e, t); }
    /* close mobile nav after section link click */
    const nl = document.getElementById("p-navlinks");
    if(nl && nl.classList.contains("open") && e.target.closest("a[href^='#sec-']")) nl.classList.remove("open");
  });
  document.addEventListener("submit", e => {
    const f = e.target.closest("form[data-cform]");
    if(f){ e.preventDefault(); handleContentForm(f); }
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if(el.dataset && el.dataset.search){
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runSearch(el.dataset.search, el.value), 220);
    }
  });
  document.addEventListener("change", e => {
    const el = e.target;
    if(el.dataset && el.dataset.filter){
      if(el.dataset.filter === "prj-feat"){
        el.dataset.on = el.dataset.on === "1" ? "0" : "1";
        el.classList.toggle("active", el.dataset.on === "1");
      }
      applyStatusFilters();
    }
  });
  document.addEventListener("keydown", e => {
    if(e.key === "Escape"){
      const bd = document.getElementById("modal-root").firstElementChild;
      if(bd && Modal.confirmClose()) Modal.close();
      const nl = document.getElementById("p-navlinks");
      if(nl && nl.classList.contains("open")) nl.classList.remove("open");
      const sb = document.getElementById("p-searchbar");
      if(sb && sb.classList.contains("open")) PUB.searchOpen();
    }
    /* Enter opens focused project/post card */
    if(e.key === "Enter" && e.target.dataset && e.target.dataset.act === "open-project"){
      Router.go("#/project/" + e.target.dataset.id);
    }
    if(e.key === "Enter" && e.target.dataset && e.target.dataset.act === "open-post"){
      Router.go("#/post/" + e.target.dataset.id);
    }
  });
}

async function init(){
  try{
    await Media.init();
    await Data.loadAll();
    await Store.init();
    APPEAR.apply();
    try{
      const vt = localStorage.getItem("npx.visTheme");
      if(vt) document.documentElement.dataset.mode = vt;
      if(vt) { const tb = document.querySelector("[data-act='theme-toggle']"); if(tb) tb.innerHTML = I(vt === "dark" ? "sun" : "moon"); }
    }catch(e){}
    window.addEventListener("hashchange", onHash);
    window.addEventListener("beforeunload", onUnload);
    window.addEventListener("resize", U.debounce(() => {
      if(!document.getElementById("admin-root").hidden) ADM.matchMediaAdmin();
    }, 150));
    setupDelegation();
    Router.route();
    window.__APP__ = { State, Data, Store, Media, APP_CONFIG, Backup, PUB, ADM, MediaDB, Auth, ProfileEdit, PostEdit, ProjEdit, Wiz }; /* debug handle */
  }catch(err){
    console.error("Init error:", err);
    document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#b00020">Something went wrong while starting the app: ' + U.esc(err.message) + '<br>Try refreshing. If the problem persists, clear this site\'s browser data.</div>';
  }
}
if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
else init();
